# docker-compose.override.yml
#
# Automatically merged with docker-compose.yml when you run:
#   docker compose up
#
# Overrides production config for development:
# - Dev Dockerfiles with hot reload
# - Source code bind-mounts
# - Named volumes for node_modules
# - Different container names (-dev suffix)
# - Project name surveyflow-dev (avoids conflicts with production)
#
# To use production mode instead:
#   docker compose -f docker-compose.yml up --build

name: surveyflow-dev

services:
  postgres:
    container_name: surveyflow-postgres-dev

  minio:
    container_name: surveyflow-minio-dev

  chromium:
    container_name: surveyflow-chromium-dev
    image: browserless/chrome:latest
    ports:
      - "3000:3000"

  dotnet-backend:
    container_name: surveyflow-dotnet-backend-dev
    build:
      dockerfile: Dockerfile.dotnet-backend
      target: dev
    volumes:
      - ./dotnet-backend:/app/dotnet-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=surveyflow;Username=surveyflow;Password=surveyflow123"
      Minio__Endpoint: http://minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
      Superuser__Email: ${SUPERUSER_EMAIL:-admin@example.com}
      Superuser__Password: ${SUPERUSER_PASSWORD:-admin12345}
      CHROMIUM_WS_ENDPOINT: ws://chromium:3000
    depends_on:
      - chromium
    ports:
      - "${DOTNET_BACKEND_PORT:-5000}:5000"

  angular-frontend:
    container_name: surveyflow-angular-frontend-dev
    build:
      dockerfile: Dockerfile.angular-frontend
      target: dev
    volumes:
      - ./angular-frontend:/app/angular-frontend
      - angular_node_modules:/app/angular-frontend/node_modules
    environment:
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    ports:
      - "4200:4200"
    depends_on:
      - dotnet-backend

volumes:
  angular_node_modules:
