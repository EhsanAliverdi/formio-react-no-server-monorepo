name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HPA.SurveyFlow.Web/package-lock.json

      - name: Restore API
        run: dotnet restore HPA.SurveyFlow.slnx

      - name: Build API
        run: dotnet build HPA.SurveyFlow.slnx --configuration Release --no-restore

      - name: Install Web
        working-directory: HPA.SurveyFlow.Web
        run: npm ci

      - name: Build Web
        working-directory: HPA.SurveyFlow.Web
        run: npm run build

      - name: Validate Development Compose
        run: docker compose --env-file HPA.SurveyFlow.Docker/env/development.env -f HPA.SurveyFlow.Docker/compose/docker-compose.yml -f HPA.SurveyFlow.Docker/compose/docker-compose.development.yml config

      - name: Validate UAT Compose
        run: docker compose --env-file HPA.SurveyFlow.Docker/env/uat.env -f HPA.SurveyFlow.Docker/compose/docker-compose.yml -f HPA.SurveyFlow.Docker/compose/docker-compose.uat.yml config

      - name: Validate Production Compose
        run: docker compose --env-file HPA.SurveyFlow.Docker/env/production.env -f HPA.SurveyFlow.Docker/compose/docker-compose.yml -f HPA.SurveyFlow.Docker/compose/docker-compose.production.yml config
