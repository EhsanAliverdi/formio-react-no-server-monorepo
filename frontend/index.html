<!DOCTYPE html>
<html lang="en" class="relative min-h-full">
  <head>
    <!-- Required Meta Tags Always Come First -->
    <meta charset="utf-8" />
    <meta name="robots" content="max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://tailwindadmin.local/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta
      name="description"
      content="A modern CMS dashboard for managing posts, members, and site content with ease."
    />

    <meta name="twitter:site" content="@tailwindadmin" />
    <meta name="twitter:creator" content="@tailwindadmin" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TailwindAdmin" />
    <meta
      name="twitter:description"
      content="A modern CMS dashboard for managing posts, members, and site content with ease."
    />
    <meta name="twitter:image" content="/images/logo/logo.svg" />

    <meta property="og:url" content="https://tailwindadmin.local/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TailwindAdmin" />
    <meta property="og:title" content="TailwindAdmin" />
    <meta
      property="og:description"
      content="A modern CMS dashboard for managing posts, members, and site content with ease."
    />
    <meta property="og:image" content="/images/logo/logo.svg" />

    <!-- Title -->
    <title>TailwindAdmin</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Check and Update -->
    <script>
      const html = document.querySelector('html');
      const isLightOrAuto =
        localStorage.getItem('hs_theme') === 'light' ||
        (localStorage.getItem('hs_theme') === 'auto' &&
          !window.matchMedia('(prefers-color-scheme: dark)').matches);
      const isDarkOrAuto =
        localStorage.getItem('hs_theme') === 'dark' ||
        (localStorage.getItem('hs_theme') === 'auto' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);

      if (isLightOrAuto && html.classList.contains('dark')) html.classList.remove('dark');
      else if (isDarkOrAuto && html.classList.contains('light')) html.classList.remove('light');
      else if (isDarkOrAuto && !html.classList.contains('dark')) html.classList.add('dark');
      else if (isLightOrAuto && !html.classList.contains('light')) html.classList.add('light');
    </script>

    <style>
      @keyframes typing {
        0% {
          opacity: 1;
          scale: 1;
        }

        50% {
          opacity: 0.75;
          scale: 0.75;
        }

        100% {
          opacity: 1;
          scale: 1;
        }
      }
    </style>
  </head>

  <body class="bg-gray-100 dark:bg-neutral-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
