name: hpa-surveyflow-prod

services:
  postgres:
    container_name: hpa-surveyflow-postgres-prod
    image: postgres:16
    pull_policy: always
    environment:
      POSTGRES_DB: surveyflow
      POSTGRES_USER: surveyflow
      POSTGRES_PASSWORD: surveyflow123
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveyflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    container_name: hpa-surveyflow-minio-prod
    image: minio/minio:latest
    pull_policy: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data

  chromium:
    container_name: hpa-surveyflow-chromium-prod
    image: browserless/chrome:latest
    pull_policy: always

  api:
    container_name: hpa-surveyflow-api-prod
    pull_policy: build
    build:
      context: ..
      dockerfile: HPA.SurveyFlow.Docker/Dockerfile.Api
      target: prod
      args:
        APP_VERSION: ${API_APP_VERSION:-}
        BUILD_TIME: ${BUILD_TIME:-}
        APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=surveyflow;Username=surveyflow;Password=surveyflow123"
      Minio__Endpoint: ${MINIO_ENDPOINT:-http://minio:9000}
      Minio__Region: ${MINIO_REGION:-us-east-1}
      Minio__Bucket: ${MINIO_BUCKET:-uploads}
      Minio__AccessKey: ${MINIO_ACCESS_KEY:-minioadmin}
      Minio__SecretKey: ${MINIO_SECRET_KEY:-minioadmin}
      Superuser__Email: ${SUPERUSER_EMAIL:-admin@example.com}
      Superuser__Password: ${SUPERUSER_PASSWORD:-admin12345}
      APP_VERSION: ${API_APP_VERSION:-}
      BUILD_TIME: ${BUILD_TIME:-}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      CHROMIUM_WS_ENDPOINT: ws://chromium:3000
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      chromium:
        condition: service_started

  web:
    container_name: hpa-surveyflow-web-prod
    pull_policy: build
    build:
      context: ..
      dockerfile: HPA.SurveyFlow.Docker/Dockerfile.Web
      target: prod
      pull: true
      args:
        ANGULAR_API_BASE_URL: ${ANGULAR_API_BASE_URL:-}
    ports:
      - "${WEB_PORT:-4201}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
