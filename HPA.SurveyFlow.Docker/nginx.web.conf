server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Enable gzip compression for text-based assets
	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_types
		text/plain
		text/css
		text/javascript
		application/javascript
		application/json
		image/svg+xml
		font/woff2;

	# Long-lived cache for hashed static assets (Angular outputs content-hashed filenames)
	location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
		access_log off;
	}

	# Proxy API requests to the .NET API service.
	location /api/ {
		proxy_pass http://api:5000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Angular SPA fallback — all unmatched paths serve index.html
	location / {
		try_files $uri $uri/ /index.html;
	}
}
